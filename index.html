<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8cc65f">
<link rel="icon" type="image/png" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<title>Engineer Empire</title>
<meta name="description" content="Build a factory town, keep the supply chain moving, and launch rockets.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<div id="app">
  <div id="rotate" aria-live="polite"><div><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="M11 18.5h2"/></svg><b>Turn your phone upright</b><small>Engineer Empire plays in portrait</small></div></div>
  <canvas id="world" aria-label="Factory town. Tap a building to open it. Drag to look around."></canvas>
  <div id="labels"></div>

  <header id="hud">
    <div class="cash">
      <span class="coin" aria-hidden="true">$</span>
      <span class="cash-text">
        <span id="town" class="town-name"></span>
        <b id="cash">0</b>
        <small id="rate">+0 per sec</small>
      </span>
      <button id="shop-btn" class="cash-plus" aria-label="Shop: get more cash">+</button>
    </div>
    <span class="hud-right">
    <button id="map-btn" class="map-btn" aria-label="Your worlds" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg>
    </button>
    <button id="menu-btn" class="icon-btn" aria-label="Menu: achievements and settings">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg>
      <span class="dot" id="menu-dot" hidden></span>
    </button>
    </span>
  </header>

  <div id="ep" class="ep-chip" hidden></div>

  <button id="contract" class="contract" hidden>
    <span class="c-top"><span class="c-who"></span><span class="c-what"></span></span>
    <span class="c-bot"><span class="c-bar"><i></i></span><span class="c-time"></span></span>
  </button>

  <button id="boost-btn" class="boost">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
    <span id="boost-text">×2</span>
    <span class="ad-tag">AD</span>
  </button>

  <div id="hint" class="hint" hidden></div>
  <div id="guide" class="guide" hidden role="status" aria-live="polite"><div id="guide-bubble" class="guide-bubble"></div></div>
  <div id="tut-finger" class="tut-finger" hidden aria-hidden="true"><svg width="34" height="40" viewBox="0 0 34 40"><path d="M17 38 3 20h8V3h12v17h8z" fill="#ffc23d" stroke="#5a4300" stroke-width="2.5" stroke-linejoin="round"/></svg></div>
  <button id="launch-btn" class="launch-btn" hidden>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2c3 2.5 4.5 6 4.5 10v5h-9v-5C7.5 8 9 4.5 12 2z"/><path d="M7.5 14 4.5 17v3h3M16.5 14l3 3v3h-3"/></svg>
    Rocket ready: launch!
  </button>
  <div id="flash" class="flash" hidden></div>
  <div id="fade" class="fade" aria-hidden="true"></div>
  <div id="warp" class="warp" aria-hidden="true"><i></i></div>

  <section id="sheet" class="sheet" hidden aria-live="polite"></section>

  <div id="modal" class="modal" hidden><div class="modal-card" id="modal-card"></div></div>

  <div id="toast" class="toast" hidden></div>

  <div id="sim-ad" class="sim-ad" hidden role="dialog" aria-label="Test ad">
    <div class="sim-card">
      <button class="sim-close" aria-label="Close ad">&times;</button>
      <div class="sim-label">Test ad · browser preview</div>
      <h2>Your ad plays here</h2>
      <p>On a phone, a real AdMob rewarded video plays here. Reward: <b class="sim-why"></b></p>
      <div class="sim-bar"><i></i></div>
      <button class="sim-claim" disabled>Reward in 5s</button>
      <div class="sim-ask" hidden>
        <p><b>Close the ad?</b> You won't get the reward.</p>
        <div class="sim-ask-row"><button class="sim-keep">Keep watching</button><button class="sim-quit">Close ad</button></div>
      </div>
    </div>
  </div>
</div>
<div id="boot-error" hidden></div>
<script>
  // Shows any startup error on screen (and in the app console) instead of a silent blank town.
  (function () {
    function show(msg) {
      var el = document.getElementById('boot-error');
      if (!el) return;
      el.hidden = false;
      el.textContent += (el.textContent ? '\n' : '') + msg;
      try { console.error('[boot] ' + msg); } catch (e) {}
    }
    window.__bootError = show;
    window.addEventListener('error', function (e) { show((e.message || 'Error') + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : '')); });
    window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason)); });
  })();
</script>
<script type="module" src="/src/main.js"></script>
</body>
</html>
