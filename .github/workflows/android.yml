name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install and build the game
        run: |
          npm ci
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build installable test app (APK)
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"

      - name: Save the build log if it failed
        if: failure()
        run: |
          mkdir -p /tmp/out && tail -400 "$RUNNER_TEMP/gradle.log" > /tmp/out/android-build.log || true
          cd /tmp/out
          git init -q -b ci-logs
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Android build log for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs

      - uses: actions/upload-artifact@v4
        with:
          name: bolt-works-android-test
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
