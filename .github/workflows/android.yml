name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install and build the game
        run: |
          npm ci
          npm run build
          npx cap sync android

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses (SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build installable test app (APK)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bolt-works-android-test
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
