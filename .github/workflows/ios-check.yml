name: iPhone check (no Apple account needed)

# Compiles the iPhone app on a cloud Mac without signing, runs it in the
# iPhone simulator, and saves screenshots. Proves the app builds and runs.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Build the game
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Compile for real iPhones (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO build | tail -5

      - name: Compile for the iPhone simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO build | tail -5

      - name: Run in the simulator and take screenshots
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for r,v in d.items() if 'iOS' in r for x in v if x['name'].startswith('iPhone')))")
          echo "Using simulator $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find build-sim -name "App.app" -path "*iphonesimulator*" | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p shots
          xcrun simctl launch --terminate-running-process --stdout="$PWD/shots/stdout.txt" --stderr="$PWD/shots/stderr.txt" "$DEVICE" com.boltworks.idlefactory
          sleep 10; xcrun simctl io "$DEVICE" screenshot shots/0-after-10s.png
          sleep 15; xcrun simctl io "$DEVICE" screenshot shots/1-after-25s.png
          sleep 20; xcrun simctl io "$DEVICE" screenshot shots/2-after-45s.png
          xcrun simctl spawn "$DEVICE" log show --last 2m --predicate 'process == "App"' --style compact > shots/app-log.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iphone-simulator-screenshots
          path: shots/

      - name: Save screenshots to the ci-screenshots branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -R shots/. /tmp/out/ 2>/dev/null || true
          cd /tmp/out
          git init -q -b ci-screenshots
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add -A && git commit -qm "Simulator screenshots for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-screenshots
